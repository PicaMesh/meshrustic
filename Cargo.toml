[workspace]
resolver = "2"
members = [
    "boards/nrf52840",
    "boards/rpi-app",
    "crates/mesh-crypto",
    "crates/mesh-protocol",
    "crates/mesh-radio",
    "crates/mesh-routing",
    "crates/mesh-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-PicaMesh-Commercial"
publish = false

# The firmware is the only release artefact that ships, so the profile is tuned for
# size: full LTO and a single codegen unit collapse the duplicated monomorphisations
# across the workspace crates, "s" trades a little speed for a lot of code, and the
# debug info is reduced to line tables so the ELF stays analysable without the
# multi-megabyte DWARF payload. The line tables are kept in the ELF (`strip` stays
# off): the shipped image only carries the loadable sections, so the debug info
# costs nothing on the node.
# Measured on the nRF52840 image: 487 024 -> 329 664 bytes (-32.4 %).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
strip = "none"

# The test suite runs under the `test` profile, which derives from `dev` and has
# the overflow checks on. The arithmetic that relies on wrapping is therefore
# exercised by the tests and not only by the release build.

