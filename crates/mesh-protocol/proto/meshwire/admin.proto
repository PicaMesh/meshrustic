syntax = "proto3";

package meshwire;

import "meshwire/config.proto";
import "meshwire/packet.proto";
import "meshwire/channel.proto";

// Wire-compatible AdminMessage subset for MeshRustic remote management.
message AdminMessage {
  enum ConfigType {
    DEVICE_CONFIG = 0;
    POSITION_CONFIG = 1;
    POWER_CONFIG = 2;
    NETWORK_CONFIG = 3;
    DISPLAY_CONFIG = 4;
    LORA_CONFIG = 5;
    BLUETOOTH_CONFIG = 6;
    SECURITY_CONFIG = 7;
    SESSIONKEY_CONFIG = 8;
    DEVICEUI_CONFIG = 9;
  }

  message DeviceMetadata {
    string firmware_version = 1;
    uint32 hw_model = 3;
  }

  bytes session_passkey = 101;

  oneof payload_variant {
    uint32 get_channel_request = 1;
    Channel get_channel_response = 2;
    bool get_owner_request = 3;
    User get_owner_response = 4;
    ConfigType get_config_request = 5;
    Config get_config_response = 6;
    uint32 get_module_config_request = 7;
    ModuleConfig get_module_config_response = 8;
    bool get_device_metadata_request = 12;
    DeviceMetadata get_device_metadata_response = 13;
    Config set_config = 34;
    bool begin_edit_settings = 64;
    bool commit_edit_settings = 65;
    int32 reboot_seconds = 97;
  }
}

// Empty stub ModuleConfig so get_module_config always has a reply payload.
message ModuleConfig {}
