services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${DEV_IMAGE:-yourorg/embedded-rust-dev:latest}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - CARGO_HOME=/workspace/.cargo-home
      - RUSTUP_HOME=/opt/rustup
      - HOME=/workspace
      - TMPDIR=/workspace/.ci-cache/tmp
    tty: true
    stdin_open: true
